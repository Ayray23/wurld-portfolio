name: Quality
on:
  push:
    branches: [main, feature/artist-cms-firebase]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install emulator test dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund
      - name: Verify Firestore security rules
        working-directory: tests/rules
        run: npm run test:rules
